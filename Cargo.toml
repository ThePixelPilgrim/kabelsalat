[package]
name = "kabelsalat"
version = "0.2.4"
edition = "2024"

[[bin]]
name = "kabelsalat"
path = "src/main.rs"

[dependencies]
libadwaita = { version = "0.9.2", features = ["v1_5"] }
relm4 = { version = "0.11.0", features = ["libadwaita"] }
# gio is already pulled in transitively via gtk4/relm4; this only turns on the
# v2_80 feature so ApplicationCommandLine::{print_literal,printerr_literal}
# are available (gio-0.22.8 gates them behind it).
gio = { version = "0.22", features = ["v2_80"] }
vte4 = { version = "0.10.0", features = ["gtk_v4_18", "v0_82"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
klamottenkiste = { path = "../klamottenkiste/klamottenkiste" }

[target.'cfg(unix)'.dependencies]
# Only for `kill(pid, SIGTERM)`: std can send SIGKILL but not SIGTERM.
libc = "0.2"
