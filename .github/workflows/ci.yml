# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Ubuntu's GTK/VTE are too old (needs GTK 4.18+, libadwaita 1.5+,
    # VTE 0.82+); Fedora ships them.
    container: fedora:43
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc cargo rustfmt clippy tmux
          gtk4-devel libadwaita-devel vte291-gtk4-devel mesa-libgbm-devel

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-fedora43-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-fedora43-

      - name: Versions
        run: |
          cargo --version
          pkg-config --modversion gtk4 libadwaita-1 vte-2.91-gtk4
          tmux -V

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked
